<!DOCTYPE html><html lang="es" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0" name="viewport"><meta content="web_blank" name="shell-type"><title>OpenDayCare - Acceso Familiar</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

m","space-md":"1rem","margin-mobile":"1rem","margin":"2.5rem","space-sm":"0.5rem","space-xs":"0.25rem"},"fontFamily":{"headline-sm":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"],"label-lg":["Plus Jakarta Sans"],"body-lg":["Plus Jakarta Sans"],"label-md":["Plus Jakarta Sans"],"headline-lg":["Plus Jakarta Sans"],"headline-lg-mobile":["Plus Jakarta Sans"],"display-mobile":["Plus Jakarta Sans"],"body-md":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"],"body-sm":["Plus Jakarta Sans"],"title-md":["Plus Jakarta Sans"],"display":["Plus Jakarta Sans"]},"fontSize":{"headline-sm":["20px",{"lineHeight":"28px","fontWeight":"600"}],"label-sm":["11px",{"lineHeight":"14px","letterSpacing":"0.04em","fontWeight":"700"}],"label-lg":["14px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"600"}],"body-lg":["16px",{"lineHeight":"26px","fontWeight":"400"}],"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"600"}],"headline-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.02em","fontWeight":"700"}],"headline-lg-mobile":["26px",{"lineHeight":"32px","letterSpacing":"-0.01em","fontWeight":"700"}],"display-mobile":["32px",{"lineHeight":"38px","letterSpacing":"-0.02em","fontWeight":"800"}],"body-md":["14px",{"lineHeight":"22px","fontWeight":"400"}],"headline-md":["24px",{"lineHeight":"32px","letterSpacing":"-0.01em","fontWeight":"600"}],"body-sm":["12px",{"lineHeight":"18px","fontWeight":"400"}],"title-md":["18px",{"lineHeight":"24px","fontWeight":"600"}],"display":["44px",{"lineHeight":"52px","letterSpacing":"-0.03em","fontWeight":"800"}]}}}};</script></head><body class="bg-background font-body-md text-on-surface antialiased"><main class="min-h-screen w-full flex items-center justify-center p-gutter-mobile bg-background"><div class="flex flex-col w-full max-w-2xl mx-auto py-space-sm sm:py-space-md">
<!-- Card Container: Soft Contemporary Humanism with Level 1 warm shadow -->
<div class="relative w-full bg-surface-container-lowest rounded-xl shadow-xl overflow-hidden flex flex-col">
<!-- Top Decorative Gentle Glow -->
<div class="absolute -top-16 -right-16 w-52 h-52 bg-secondary-container/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -top-12 -left-12 w-44 h-44 bg-primary-fixed/30 rounded-full blur-2xl pointer-events-none"></div>
<!-- Header Bar -->
<header class="relative z-10 px-gutter-mobile sm:px-gutter py-space-md bg-surface-container-low flex items-center justify-between">
<!-- Top Left: Cancel Action -->
<button class="inline-flex items-center gap-space-xs px-space-md py-space-xs rounded-full font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-variant transition-colors" onclick="window.history.back()" type="button">
<span class="material-symbols-outlined text-[18px]">close</span>
<span class="">Cancelar</span>
</button>
<!-- Top Center: Title & Friendly Indicator -->
<div class="flex items-center gap-space-xs">
<div class="w-2.5 h-2.5 rounded-full bg-primary-container animate-pulse"></div>
<h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight">
          Agregar niño
        </h1>
</div>
<!-- Top Right: Primary Save Action -->
<button class="inline-flex items-center gap-space-xs px-space-lg py-space-xs sm:py-space-sm rounded-full bg-primary-container text-on-primary font-label-lg text-label-lg shadow-sm hover:brightness-105 active:scale-95 transition-all" id="btn-save-child" type="button">
<span class="material-symbols-outlined text-[18px]">check</span>
<span class="">Guardar</span>
</button>
</header>
<!-- Main Form Scroll Area -->
<form class="relative z-10 p-gutter-mobile sm:p-gutter flex flex-col gap-space-lg" id="form-add-child" onsubmit="event.preventDefault();">
<!-- 1. Avatar / Foto de perfil del infante -->

<!-- 2. Nombre Completo -->
<div class="flex flex-col gap-space-xs">
<div class="flex justify-between items-baseline">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-1" for="child-fullname">
<span class="">Nombre completo</span>
<span class="text-primary font-bold">*</span>
</label>
<span class="font-label-sm text-label-sm text-on-surface-variant">Obligatorio</span>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none">child_care</span>
<input class="w-full h-12 pl-11 pr-4 bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md rounded-lg shadow-sm focus:outline-none focus:bg-surface-bright transition-all" id="child-fullname" placeholder="Ej. Mateo García Morales" required="" type="text">
</div>
</div>
<!-- 3. Grid Row: Fecha de nacimiento & Sala -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-space-md">
<!-- Fecha de nacimiento -->
<div class="flex flex-col gap-space-xs">
<div class="flex justify-between items-baseline">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-1" for="child-dob">
<span class="">Fecha de nacimiento</span>
<span class="text-primary font-bold">*</span>
</label>
<span class="font-label-sm text-label-sm text-on-surface-variant">DD/MM/AAAA</span>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none">cake</span>
<input class="w-full h-12 pl-11 pr-4 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg shadow-sm focus:outline-none focus:bg-surface-bright transition-all cursor-pointer" id="child-dob" required="" type="date">
</div>
</div>
<!-- Sala Dropdown -->
<div class="flex flex-col gap-space-xs">
<div class="flex justify-between items-baseline">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-1" for="child-room">
<span class="">Sala asignada</span>
<span class="text-primary font-bold">*</span>
</label>
<span class="font-label-sm text-label-sm text-primary font-semibold">Grupo</span>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none">meeting_room</span>
<select class="w-full h-12 pl-11 pr-10 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg shadow-sm focus:outline-none focus:bg-surface-bright appearance-none transition-all cursor-pointer" id="child-room" required="">
<option disabled="" selected="" value="">Seleccionar sala pedagógica...</option>
<option value="cunas">Sala Cunas (0 - 1 años)</option>
<option value="soles">Sala Soles (1 - 2 años)</option>
<option value="estrellas">Sala Estrellas (2 - 3 años)</option>
<option value="exploradores">Sala Exploradores (3 - 4 años)</option>
</select>
<span class="material-symbols-outlined absolute right-3.5 text-on-surface-variant text-[20px] pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- 4. Alergias e Intolerancias (Interactive Chip Tags) -->
<div class="flex flex-col gap-space-xs">
<div class="flex justify-between items-baseline">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-1.5" for="child-allergies">
<span class="material-symbols-outlined text-primary text-[18px]">health_and_safety</span>
<span class="">Alergias (Etiquetas)</span>
</label>
<span class="font-label-sm text-label-sm text-on-surface-variant">Opcional</span>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none">label</span>
<input class="w-full h-12 pl-11 pr-4 bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md rounded-lg shadow-sm focus:outline-none focus:bg-surface-bright transition-all" id="child-allergies" placeholder="Ej. Lactosa, frutos secos, polen..." type="text">
</div>
</div>
<!-- 5. Notas Médicas & Cuidados Especiales -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-1.5" for="child-medical-notes">
<span class="material-symbols-outlined text-secondary text-[18px]">medical_services</span>
<span class="">Notas médicas y cuidados especiales</span>
</label>
<span class="font-label-sm text-label-sm text-on-surface-variant" id="char-counter">0 / 600</span>
</div>
<div class="relative flex flex-col">
<textarea class="w-full p-3.5 bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md rounded-lg shadow-sm focus:outline-none focus:bg-surface-bright transition-all resize-y" id="child-medical-notes" maxlength="600" placeholder="Indicaciones del pediatra, medicación habitual, horarios de dosis, números de contacto de emergencia o cuidados especiales durante la siesta y comidas..." rows="4"></textarea>
</div>

</div>
<!-- 6. Friendly Security & Care Protocol Note -->

<!-- Mobile Fallback Action Button Bar (Visible on mobile screens) -->
<div class="flex sm:hidden items-center justify-end gap-space-sm pt-space-xs">
<button class="flex-1 py-space-sm rounded-full bg-surface-container font-label-lg text-label-lg text-on-surface-variant text-center" onclick="window.history.back()" type="button">
          Cancelar
        </button>
<button class="flex-1 py-space-sm rounded-full bg-primary-container text-on-primary font-label-lg text-label-lg text-center shadow-md active:scale-95 transition-all" id="btn-save-child-mobile" type="button">
          Guardar niño
        </button>
</div>
</form>
</div>
</div>
<script>
  // Character counter for medical notes
  const notesArea = document.getElementById('child-medical-notes');
  const charCounter = document.getElementById('char-counter');
  if (notesArea && charCounter) {
    notesArea.addEventListener('input', () => {
      charCounter.textContent = `${notesArea.value.length} / 600`;
    });
  }

  // Interactive tag addition for allergies
  const allergyInput = document.getElementById('input-new-allergy');
  const addAllergyBtn = document.getElementById('btn-add-allergy');
  const allergyList = document.getElementById('allergies-chip-list');

  function addNewAllergyChip() {
    if (!allergyInput || !allergyList) return;
    const value = allergyInput.value.trim();
    if (!value) return;

    const chip = document.createElement('span');
    chip.className = 'inline-flex items-center gap-1 px-3 py-1 rounded-full bg-secondary-fixed text-on-secondary-fixed font-label-md text-label-md shadow-xs transition-transform active:scale-95';
    
    const textSpan = document.createElement('span');
    textSpan.textContent = value;
    
    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'hover:text-primary transition-colors flex items-center justify-center p-0.5';
    removeBtn.setAttribute('aria-label', `Remover ${value}`);
    removeBtn.innerHTML = '<span class="material-symbols-outlined text-[14px]">cancel</span>';
    removeBtn.onclick = function() {
      chip.remove();
    };

    chip.appendChild(textSpan);
    chip.appendChild(removeBtn);
    allergyList.appendChild(chip);

    allergyInput.value = '';
    allergyInput.focus();
  }

  if (addAllergyBtn) {
    addAllergyBtn.addEventListener('click', addNewAllergyChip);
  }
  if (allergyInput) {
    allergyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addNewAllergyChip();
      }
    });
  }

  // Simulated avatar picker
  const dropzone = document.getElementById('avatar-dropzone');
  const avatarInput = document.getElementById('avatar-input');
  const avatarPreview = document.getElementById('avatar-preview');

  if (dropzone && avatarInput && avatarPreview) {
    dropzone.addEventListener('click', () => {
      avatarInput.click();
    });

    avatarInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          avatarPreview.src = event.target.result;
          avatarPreview.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    });
  }

  // Save actions handling
  const saveActions = [document.getElementById('btn-save-child'), document.getElementById('btn-save-child-mobile')];
  saveActions.forEach((btn) => {
    if (btn) {
      btn.addEventListener('click', () => {
        const nameField = document.getElementById('child-fullname');
        if (nameField && !nameField.value.trim()) {
          nameField.focus();
          nameField.classList.add('bg-error-container/30');
          setTimeout(() => nameField.classList.remove('bg-error-container/30'), 1500);
          return;
        }
        btn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span><span>Guardando...</span>';
        setTimeout(() => {
          btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">done_all</span><span>¡Guardado!</span>';
          btn.classList.add('bg-secondary');
        }, 600);
      });
    }
  });
</script></main>

</body></html>
