<script>
  // Micro-interacción ligera para los chips de destinatarios
  document.querySelectorAll('.para-chip').forEach(button => {
    button.addEventListener('click', () => {
      const isSelected = button.getAttribute('data-selected') === 'true';
      if (isSelected) {
        button.setAttribute('data-selected', 'false');
        button.classList.remove('bg-secondary-fixed', 'text-on-secondary-fixed');
        button.classList.add('bg-surface-container-low');
      } else {
        button.setAttribute('data-selected', 'true');
        button.classList.remove('bg-surface-container-low');
        button.classList.add('bg-secondary-fixed', 'text-on-secondary-fixed');
      }
    });
  });
</script></main>
